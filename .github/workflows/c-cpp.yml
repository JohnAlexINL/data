name: C CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: make
      run: make
      
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: data
        path: ./data
        if-no-files-found: warn
        retention-days: 5
