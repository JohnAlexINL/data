name: Build binare

on:
  push:
    branches: [ "main" ]
    paths:
    - 'src/**'
    - 'include/**'
    - 'Makefile'
    - '.github/workflows/*'
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: make
      run: make
    - name: strip
      run: strip ./data
    - name: test help 1
      run: ./data -h
    - name: test help 2
      run: ./data --help
    - name: test file 1
      run: dd if=/dev/zero of=test bs=1B count=5 && ./data test && rm test
    - name: test file 2
      run: dd if=/dev/zero of=test bs=1KB count=5 && ./data test && rm test
    - name: test file 3
      run: dd if=/dev/zero of=test bs=1MB count=5 && ./data test && rm test
    - name: test file 4
      run: dd if=/dev/zero of=test bs=1G count=5 && ./data test && rm test
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: data
        path: ./data
        if-no-files-found: warn
        retention-days: 5
